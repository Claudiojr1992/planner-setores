server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno do Docker: resolve os serviços na hora da requisição
  # (o nginx sobe mesmo se auth/rest/storage ainda não existirem — ex.: modo demonstração)
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_read_timeout 120s;

  # ---- Gateway Supabase (substitui o Kong) ----
  location /auth/v1/ {
    set $up_auth auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass http://$up_auth;
  }
  location /rest/v1/ {
    set $up_rest rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass http://$up_rest;
  }
  location /storage/v1/ {
    set $up_storage arquivos:5000;
    client_max_body_size 50m;
    proxy_set_header X-Forwarded-Prefix /storage/v1;
    rewrite ^/storage/v1/(.*)$ /$1 break;
    proxy_pass http://$up_storage;
  }

  # ---- Interface ----
  location = /config.js { add_header Cache-Control "no-store"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=604800"; }
  location / { try_files $uri $uri/ /index.html; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
