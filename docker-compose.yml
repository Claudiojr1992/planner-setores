# =====================================================================
# Planner de Setores — tudo em Docker (não precisa de Node.js)
#   http://localhost:8080  sistema          http://localhost:8025  caixa de e-mails
# Serviços: db (PostgreSQL) · auth (login/GoTrue) · rest (API/PostgREST) · arquivos (anexos e logotipo)
#           migrador (cria/atualiza tabelas) · web (interface + gateway) · notificador · mailpit
# =====================================================================
name: planner-setores

x-db-url: &db-env
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner-senha-local-troque}

services:
  db:
    build: { context: ., dockerfile: docker/db/Dockerfile }
    image: planner-postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner-senha-local-troque}
    volumes:
      - planner-banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 30

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${ENDERECO_PUBLICO:-http://localhost:8080}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-planner-senha-local-troque}@db:5432/postgres
      GOTRUE_SITE_URL: ${ENDERECO_PUBLICO:-http://localhost:8080}
      GOTRUE_URI_ALLOW_LIST: ${ENDERECO_PUBLICO:-http://localhost:8080}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-planner-local-dev-secret-troque-em-producao-0123456789abcdef}
      GOTRUE_JWT_ISSUER: ${ENDERECO_PUBLICO:-http://localhost:8080}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"        # sem confirmação de e-mail: a diretoria aprova o acesso
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_EMAIL_REMETENTE:-planner@suaempresa.com.br}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mailpit}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USUARIO:-}
      GOTRUE_SMTP_PASS: ${SMTP_SENHA:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_NOME_REMETENTE:-Planner de Setores}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Redefinir sua senha do Planner
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Confirme seu cadastro no Planner
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 200
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    command: ["postgrest"]
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-planner-senha-local-troque}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-planner-local-dev-secret-troque-em-producao-0123456789abcdef}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  arquivos:
    build: ./arquivos
    restart: unless-stopped
    depends_on: { rest: { condition: service_started } }
    environment:
      JWT_SECRET: ${JWT_SECRET:-planner-local-dev-secret-troque-em-producao-0123456789abcdef}
      REST_URL: http://rest:3000
      LIMITE_BYTES: 52428800
    volumes:
      - planner-anexos:/data

  migrador:
    build: { context: ., dockerfile: docker/migrador/Dockerfile }
    depends_on: { db: { condition: service_healthy }, auth: { condition: service_healthy } }
    environment: *db-env
    restart: "no"

  web:
    build: ./web
    restart: unless-stopped
    depends_on: { migrador: { condition: service_completed_successfully } }
    ports: ["${PORTA_WEB:-8080}:80"]
    environment:
      SUPABASE_URL_PUBLICA: auto              # mesma origem: o nginx do web encaminha /auth, /rest e /storage
      SUPABASE_ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkyOTQ3NDM5LCJleHAiOjIxMDgzMDc0Mzl9.ht5aKNnFzxlMGPiAcZw1IAxIyqcSXjIrZ615_IVAXD8}
      NOME_SISTEMA: ${NOME_SISTEMA:-Planner de Setores}
      GATEWAY: "1"

  notificador:
    build: ./notificador
    restart: unless-stopped
    depends_on: { web: { condition: service_started } }
    environment:
      SUPABASE_URL: http://web
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3OTI5NDc0MzksImV4cCI6MjEwODMwNzQzOX0.V2rQEMwnlb0cqrMc0VHGoI5bLFOFbSpBeoUKN9bJRpw}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SEGURO: ${SMTP_SEGURO:-false}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
      SMTP_REMETENTE: ${SMTP_NOME_REMETENTE:-Planner de Setores} <${SMTP_EMAIL_REMETENTE:-planner@suaempresa.com.br}>
      INTERVALO_SEGUNDOS: 5

  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports: ["8025:8025"]

volumes:
  planner-banco:
  planner-anexos:
